<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SkillScan.AI - Resume Screening Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <main class="max-w-7xl mx-auto p-5 md:p-8 space-y-6">
    <section class="flex flex-col md:flex-row md:items-end md:justify-between gap-3">
      <div>
        <h1 class="text-3xl md:text-4xl font-extrabold text-emerald-400">SkillScan.AI</h1>
        <p class="text-slate-300">AI-Powered Resume Screening & Candidate Ranking</p>
      </div>
      <div class="text-sm text-slate-400">Production-ready ATS-like screening workflow</div>
    </section>

    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 md:p-6">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <div class="space-y-4">
          <div>
            <label class="block font-semibold mb-2">Upload Resumes (PDF/DOC/DOCX)</label>
            <div
              id="resumeDropZone"
              class="w-full p-5 border-2 border-dashed border-slate-600 rounded-xl text-center cursor-pointer hover:bg-slate-800/80 transition"
            >
              <p class="text-slate-300">Drag & drop multiple resumes here, or click to browse</p>
              <p class="text-xs text-slate-500 mt-1">Hold Ctrl (Windows) / Cmd (Mac) to select multiple files at once</p>
            </div>
            <input id="resumes" type="file" multiple accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" class="hidden" />
            <p id="resumeCount" class="text-sm text-slate-400 mt-2">No resumes selected</p>
            <ul id="resumeFileList" class="mt-2 space-y-1 text-sm"></ul>
          </div>
          <div>
            <label class="block font-semibold mb-2">Select Job Role</label>
            <select id="jobRole" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-lg">
              <option value="SDE">Software Development Engineer</option>
              <option value="Data Scientist">Data Scientist</option>
              <option value="Machine Learning Engineer">Machine Learning Engineer</option>
              <option value="Frontend Developer">Frontend Developer</option>
              <option value="Backend Developer">Backend Developer</option>
              <option value="DevOps Engineer">DevOps Engineer</option>
              <option value="Product Manager">Product Manager</option>
              <option value="Business Analyst">Business Analyst</option>
              <option value="Intern">Intern</option>
              <option value="custom">Custom</option>
            </select>
          </div>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block font-semibold mb-2">Paste Job Description</label>
            <textarea id="jobDescription" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-lg min-h-[120px]" placeholder="Paste JD text here. Required if role = custom and no JD file is uploaded."></textarea>
          </div>
          <div>
            <label class="block font-semibold mb-2">Or Upload JD File (PDF/DOC/DOCX/TXT)</label>
            <input id="jdFile" type="file" accept=".pdf,.doc,.docx,.txt" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-lg" />
          </div>
        </div>
      </div>

      <button id="analyzeBtn" class="mt-5 w-full bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-3 rounded-xl transition">
        Analyze & Rank Candidates
      </button>

      <div id="progressContainer" class="hidden mt-4">
        <div class="w-full bg-slate-700 rounded-full h-3">
          <div id="progressBar" class="bg-emerald-500 h-3 rounded-full transition-all duration-300" style="width: 0%;"></div>
        </div>
        <p id="status" class="text-sm text-slate-300 mt-1">Processing...</p>
      </div>
    </section>

    <section id="dashboard" class="hidden space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 md:p-5">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
          <input id="searchInput" type="text" placeholder="Search candidate..." class="p-3 bg-slate-800 border border-slate-700 rounded-lg" />
          <select id="sortBy" class="p-3 bg-slate-800 border border-slate-700 rounded-lg">
            <option value="desc">Sort by score: High to Low</option>
            <option value="asc">Sort by score: Low to High</option>
          </select>
          <input id="minScore" type="number" min="0" max="100" value="0" placeholder="Minimum score" class="p-3 bg-slate-800 border border-slate-700 rounded-lg" />
          <div class="flex gap-2">
            <button id="exportCsv" class="flex-1 bg-sky-600 hover:bg-sky-700 py-3 rounded-lg font-semibold">Export CSV</button>
            <button id="exportXlsx" class="flex-1 bg-indigo-600 hover:bg-indigo-700 py-3 rounded-lg font-semibold">Export XLSX</button>
          </div>
        </div>
      </div>

      <div id="cards" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
    </section>
  </main>

  <script>
    const resumesInput = document.getElementById("resumes");
    const resumeDropZone = document.getElementById("resumeDropZone");
    const resumeCount = document.getElementById("resumeCount");
    const resumeFileList = document.getElementById("resumeFileList");
    const jdFileInput = document.getElementById("jdFile");
    const jobRole = document.getElementById("jobRole");
    const jobDescription = document.getElementById("jobDescription");
    const analyzeBtn = document.getElementById("analyzeBtn");
    const progressContainer = document.getElementById("progressContainer");
    const progressBar = document.getElementById("progressBar");
    const statusEl = document.getElementById("status");
    const dashboard = document.getElementById("dashboard");
    const cards = document.getElementById("cards");
    const searchInput = document.getElementById("searchInput");
    const sortBy = document.getElementById("sortBy");
    const minScore = document.getElementById("minScore");
    const exportCsvBtn = document.getElementById("exportCsv");
    const exportXlsxBtn = document.getElementById("exportXlsx");

    let allResults = [];
    let selectedResumeFiles = [];

    const ALLOWED_RESUME_EXT = [".pdf", ".doc", ".docx"];

    function isAllowedResume(file) {
      const name = (file.name || "").toLowerCase();
      return ALLOWED_RESUME_EXT.some((ext) => name.endsWith(ext));
    }

    function fileKey(file) {
      return `${file.name}|${file.size}|${file.lastModified}`;
    }

    function addResumeFiles(fileList) {
      const incoming = Array.from(fileList || []);
      const rejected = [];
      incoming.forEach((file) => {
        if (!isAllowedResume(file)) {
          rejected.push(file.name);
          return;
        }
        const key = fileKey(file);
        if (!selectedResumeFiles.some((f) => fileKey(f) === key)) {
          selectedResumeFiles.push(file);
        }
      });
      if (rejected.length) {
        alert(`Skipped unsupported file(s): ${rejected.join(", ")}\nAllowed: PDF, DOC, DOCX`);
      }
      renderResumeFileList();
    }

    function removeResumeFile(index) {
      selectedResumeFiles.splice(index, 1);
      renderResumeFileList();
    }

    function renderResumeFileList() {
      const total = selectedResumeFiles.length;
      resumeCount.textContent = total
        ? `${total} resume(s) ready to analyze`
        : "No resumes selected";
      resumeFileList.innerHTML = "";
      selectedResumeFiles.forEach((file, index) => {
        const li = document.createElement("li");
        li.className = "flex items-center justify-between gap-2 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2";
        li.innerHTML = `
          <span class="truncate text-slate-200" title="${file.name}">${index + 1}. ${file.name}</span>
          <button type="button" data-index="${index}" class="text-rose-400 hover:text-rose-300 text-xs font-semibold shrink-0">Remove</button>
        `;
        li.querySelector("button").addEventListener("click", () => removeResumeFile(index));
        resumeFileList.appendChild(li);
      });
    }

    resumeDropZone.addEventListener("click", () => resumesInput.click());
    resumesInput.addEventListener("change", () => {
      addResumeFiles(resumesInput.files);
      resumesInput.value = "";
    });

    resumeDropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      resumeDropZone.classList.add("border-emerald-500", "bg-slate-800/80");
    });
    resumeDropZone.addEventListener("dragleave", () => {
      resumeDropZone.classList.remove("border-emerald-500", "bg-slate-800/80");
    });
    resumeDropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      resumeDropZone.classList.remove("border-emerald-500", "bg-slate-800/80");
      addResumeFiles(e.dataTransfer.files);
    });

    function renderSkeletons() {
      cards.innerHTML = "";
      for (let i = 0; i < 6; i += 1) {
        const div = document.createElement("div");
        div.className = "bg-slate-900 border border-slate-800 rounded-xl p-4 animate-pulse";
        div.innerHTML = `
          <div class="h-4 bg-slate-700 rounded w-2/3 mb-3"></div>
          <div class="h-3 bg-slate-700 rounded w-1/2 mb-2"></div>
          <div class="h-3 bg-slate-700 rounded w-5/6 mb-2"></div>
          <div class="h-3 bg-slate-700 rounded w-4/6"></div>
        `;
        cards.appendChild(div);
      }
      dashboard.classList.remove("hidden");
    }

    function chip(text, colorClass) {
      return `<span class="text-xs px-2 py-1 rounded-full ${colorClass}">${text}</span>`;
    }

    function filteredResults() {
      const q = searchInput.value.trim().toLowerCase();
      const min = Number(minScore.value || 0);
      let rows = allResults.filter(r =>
        (r.candidate_name || "").toLowerCase().includes(q) ||
        (r.filename || "").toLowerCase().includes(q)
      );
      rows = rows.filter(r => Number(r.match_score || 0) >= min);
      rows.sort((a, b) => sortBy.value === "asc"
        ? Number(a.match_score) - Number(b.match_score)
        : Number(b.match_score) - Number(a.match_score));
      return rows;
    }

    function renderCards() {
      const rows = filteredResults();
      cards.innerHTML = "";

      if (!rows.length) {
        cards.innerHTML = `<div class="col-span-full p-6 bg-slate-900 border border-slate-800 rounded-xl text-slate-300">No candidates match current filters.</div>`;
        return;
      }

      rows.forEach(c => {
        const skillMatches = (c.matching_skills || []).slice(0, 8).map(s => chip(s, "bg-emerald-700")).join("");
        const missingSkills = (c.missing_skills || []).slice(0, 8).map(s => chip(s, "bg-rose-700")).join("");
        const div = document.createElement("article");
        div.className = "bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3";
        div.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div>
              <h3 class="font-bold text-lg text-emerald-300">${c.candidate_name || "Unknown Candidate"}</h3>
              <p class="text-sm text-slate-400">${c.filename || "N/A"}</p>
            </div>
            <div class="text-right">
              <p class="text-xs text-slate-400">Rank</p>
              <p class="text-xl font-extrabold text-amber-300">#${c.rank}</p>
            </div>
          </div>
          <div>
            <div class="flex justify-between text-sm mb-1">
              <span>Match Score</span>
              <span class="font-semibold">${c.match_score}%</span>
            </div>
            <div class="w-full bg-slate-700 rounded-full h-2">
              <div class="bg-emerald-500 h-2 rounded-full" style="width:${c.match_score}%"></div>
            </div>
          </div>
          <div class="text-sm text-slate-300">
            <p>Experience Relevance: <span class="font-semibold">${c.experience_relevance}%</span></p>
            <p>Education Relevance: <span class="font-semibold">${c.education_relevance}%</span></p>
            <p>Semantic Similarity: <span class="font-semibold">${c.semantic_similarity}%</span></p>
          </div>
          <div>
            <p class="text-xs uppercase text-slate-400 mb-1">Matching Skills</p>
            <div class="flex flex-wrap gap-1">${skillMatches || '<span class="text-sm text-slate-400">None</span>'}</div>
          </div>
          <div>
            <p class="text-xs uppercase text-slate-400 mb-1">Missing Skills</p>
            <div class="flex flex-wrap gap-1">${missingSkills || '<span class="text-sm text-slate-400">None</span>'}</div>
          </div>
        `;
        cards.appendChild(div);
      });
    }

    async function exportResults(kind) {
      if (!allResults.length) return alert("No results to export.");
      const endpoint = kind === "csv" ? "/export/csv" : "/export/xlsx";
      const response = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ results: filteredResults() })
      });
      if (!response.ok) {
        const err = await response.json();
        return alert(err.error || "Export failed.");
      }
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = kind === "csv" ? "candidate_rankings.csv" : "candidate_rankings.xlsx";
      a.click();
      URL.revokeObjectURL(url);
    }

    analyzeBtn.addEventListener("click", async () => {
      if (!selectedResumeFiles.length) return alert("Please upload at least one resume.");
      if (jobRole.value === "custom" && !jobDescription.value.trim() && !jdFileInput.files.length) {
        return alert("Provide custom JD text or upload a JD file.");
      }

      const form = new FormData();
      selectedResumeFiles.forEach((f) => form.append("resumes", f, f.name));
      form.append("jobRole", jobRole.value);
      form.append("jobDescription", jobDescription.value);
      if (jdFileInput.files.length) form.append("jobDescriptionFile", jdFileInput.files[0]);

      analyzeBtn.disabled = true;
      analyzeBtn.textContent = "Analyzing...";
      progressContainer.classList.remove("hidden");
      statusEl.textContent = `Processing ${selectedResumeFiles.length} resume(s)...`;
      renderSkeletons();

      let pct = 10;
      progressBar.style.width = "10%";
      const interval = setInterval(() => {
        if (pct < 92) {
          pct += 6;
          progressBar.style.width = `${pct}%`;
        }
      }, 400);

      try {
        const res = await fetch("/analyze", { method: "POST", body: form });
        const payload = await res.json();
        clearInterval(interval);
        progressBar.style.width = "100%";
        if (!res.ok || payload.error) {
          throw new Error(payload.error || "Failed to process resumes.");
        }

        allResults = payload.results || [];
        dashboard.classList.remove("hidden");
        renderCards();
      } catch (err) {
        alert(err.message || "Network error.");
      } finally {
        setTimeout(() => {
          progressContainer.classList.add("hidden");
          progressBar.style.width = "0%";
          statusEl.textContent = "";
        }, 450);
        analyzeBtn.disabled = false;
        analyzeBtn.textContent = "Analyze & Rank Candidates";
      }
    });

    searchInput.addEventListener("input", renderCards);
    sortBy.addEventListener("change", renderCards);
    minScore.addEventListener("input", renderCards);
    exportCsvBtn.addEventListener("click", () => exportResults("csv"));
    exportXlsxBtn.addEventListener("click", () => exportResults("xlsx"));
  </script>
</body>
</html>
